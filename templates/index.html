<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Primary Meta Tags -->
    <title>WallRush - Real-Time Multiplayer Strategy Game</title>
    <meta name="title" content="WallRush - Real-Time Multiplayer Strategy Game" />
    <meta name="description"
        content="Play WallRush, a modern real-time multiplayer strategy game inspired by Quoridor. Race to the opposite side of the board while strategically placing walls to block your opponent. Play against AI or challenge friends online!" />
    <meta name="keywords"
        content="WallRush, Quoridor, board game, strategy game, multiplayer game, online game, real-time game, Flask, Socket.IO" />
    <meta name="author" content="WallRush" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/static/favicon.png" />
    <link rel="apple-touch-icon" href="/static/favicon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wallrush.lyxmab.de5.net/" />
    <meta property="og:title" content="WallRush - Real-Time Multiplayer Strategy Game" />
    <meta property="og:description"
        content="Play WallRush, a modern real-time multiplayer strategy game inspired by Quoridor. Race to the opposite side of the board while strategically placing walls to block your opponent." />
    <meta property="og:image" content="https://wallrush.lyxmab.de5.net/static/favicon.png" />
    <meta property="og:site_name" content="WallRush" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://wallrush.lyxmab.de5.net/" />
    <meta property="twitter:title" content="WallRush - Real-Time Multiplayer Strategy Game" />
    <meta property="twitter:description"
        content="Play WallRush, a modern real-time multiplayer strategy game inspired by Quoridor. Race to the opposite side while strategically placing walls to block your opponent." />
    <meta property="twitter:image" content="https://wallrush.lyxmab.de5.net/static/favicon.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://wallrush.lyxmab.de5.net/" />

    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>

    <section id="landing" class="landing">
        <canvas id="math-bg"></canvas>
        <div class="landing-content">
            <h1 class="landing-title">Wall<span>Rush</span></h1>
            <p class="landing-sub">Block their way</p>
            <div class="menu">
                <button id="solo-btn" class="menu-btn primary">Play vs AI</button>
                <button id="online-btn" class="menu-btn">Play Online</button>
                <a href="/game/leaders" class="leave-btn"
                    style="text-align:center;text-decoration:none;display:block;margin-top:6px">Leaderboard</a>
                <div class="menu-divider"><span>or</span></div>
                <button id="create-btn" class="menu-btn">Create Room</button>
                <div class="join-row">
                    <input id="code-input" placeholder="Room code" maxlength="6" autocomplete="off" />
                    <button id="join-btn" class="menu-btn">Join</button>
                </div>
            </div>
            <div class="landing-status" id="landing-status"></div>
        </div>
    </section>

    <section id="game" class="game hidden">
        <div class="game-shell">
            <div class="board-column">

                <div class="player-ribbon" id="opp-ribbon" aria-label="Opponent">
                    <div class="ribbon-content player-line">
                        <span class="avatar" id="opp-avatar">🐺</span>
                        <span class="name" id="opp-name">Opponent</span>
                        <span class="wall-badge" id="opp-wall-badge">🧱 10</span>
                    </div>
                    <div class="emoji-float" id="opp-emoji-float"></div>
                </div>

                <div class="board-wrap"><canvas id="board" aria-label="WallRush game board" role="img"></canvas></div>

                <div class="player-ribbon" id="user-ribbon" aria-label="Your player">
                    <div class="ribbon-content player-line">
                        <span class="avatar" id="user-avatar">🦊</span>
                        <span class="name" id="user-name">You</span>
                        <span class="wall-badge" id="user-wall-badge">🧱 10</span>
                    </div>
                    <div class="emoji-float" id="user-emoji-float"></div>
                </div>

            </div>

            <aside class="panel">
                <div class="status" id="status" aria-live="polite">Your turn</div>

                <div class="wall-inventory">
                    <div class="inv-label">Drag a wall</div>
                    <div class="inv-pieces">
                        <div class="wall-piece h" data-orient="H" id="piece-h"
                            aria-label="Drag horizontal wall" title="Drag horizontal wall"></div>
                        <div class="wall-piece v" data-orient="V" id="piece-v"
                            aria-label="Drag vertical wall" title="Drag vertical wall"></div>
                    </div>
                    <div class="wall-remaining">
                        <span id="wall-count">10</span> walls remaining
                    </div>
                </div>

                <div class="replay-panel">
                    <div class="replay-heading">
                        <span class="inv-label">Replay</span>
                        <span id="replay-count">0 moves</span>
                    </div>
                    <div class="replay-actions">
                        <button id="export-video" class="replay-btn video-btn" type="button" disabled>Export Video</button>
                        <button id="load-video" class="replay-btn" type="button">Load Video</button>
                    </div>
                    <input id="video-file" type="file" accept="video/webm,video/mp4,video/*" hidden />
                </div>

                <div class="emoji-panel">
                    <div class="inv-label">Reactions</div>
                    <div class="emoji-picker">
                        <button class="emoji-btn" data-emoji="👍">👍</button>
                        <button class="emoji-btn" data-emoji="🔥">🔥</button>
                        <button class="emoji-btn" data-emoji="😂">😂</button>
                        <button class="emoji-btn" data-emoji="😭">😭</button>
                        <button class="emoji-btn" data-emoji="😎">😎</button>
                        <button class="emoji-btn" data-emoji="🤔">🤔</button>
                        <button class="emoji-btn" data-emoji="💀">💀</button>
                        <button class="emoji-btn" data-emoji="🎉">🎉</button>
                    </div>
                </div>

                <button id="reset" class="reset-btn">New Game</button>
                <button id="leave-btn" class="leave-btn">Exit Game</button>
                <div class="room-info hidden" id="room-info">
                    Room <strong id="room-code-display">------</strong>
                </div>
            </aside>
        </div>
    </section>

    <div id="win-modal" class="win-modal hidden">
        <div class="flowers" id="flowers"></div>
        <div class="win-card">
            <div class="win-emoji" id="win-emoji">🏆</div>
            <h2 class="win-title" id="win-title">You Win!</h2>
            <p class="win-sub" id="win-sub">Well played</p>
            <div class="win-replay-actions">
                <button class="win-replay-btn" id="export-video-modal" type="button">Export Video</button>
                <button class="win-replay-btn" id="load-video-modal" type="button">Load Video</button>
            </div>
            <button class="win-btn" id="win-again">Play Again</button>
            <button class="win-exit-btn" id="win-exit">Return to Menu</button>
        </div>
    </div>

    <div id="video-viewer" class="video-viewer hidden" aria-hidden="true">
        <div class="video-card">
            <div class="video-header">
                <div>
                    <span class="video-kicker">WALLRUSH REPLAY</span>
                    <h2>Game playback</h2>
                </div>
                <button id="video-back" class="video-back" type="button">Back</button>
            </div>
            <video id="replay-video" controls playsinline preload="metadata"></video>
            <div class="video-tools">
                <label for="video-speed">Speed</label>
                <select id="video-speed">
                    <option value="0.5">0.5×</option>
                    <option value="1" selected>1×</option>
                    <option value="1.5">1.5×</option>
                    <option value="2">2×</option>
                </select>
                <a id="download-video" class="video-download" href="#" download>Download Video</a>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/game.js"></script>
</body>

</html>
